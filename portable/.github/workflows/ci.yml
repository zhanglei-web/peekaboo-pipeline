name: CPU contracts and portability
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core curl
      - run: pip install -r requirements.txt
      - run: python scripts/check_repository.py
      - run: python scripts/pipeline.py doctor
      - run: pytest -q
