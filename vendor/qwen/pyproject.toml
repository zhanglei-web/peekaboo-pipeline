[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-vlm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["huggingface_hub", "Pillow", "PyYAML", "jsonschema", "requests", "opencv-python-headless", "psutil"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
