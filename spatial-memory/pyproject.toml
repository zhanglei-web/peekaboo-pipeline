[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peekaboo-spatial-memory"
version = "0.2.0"
description = "Two-stage video spatial memory and geometric inspection sufficiency"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "opencv-python>=4.5", "Pillow>=9", "requests>=2.28", "jsonschema>=4", "scipy>=1.8", "PyYAML>=6"]

[tool.setuptools]
packages = ["online_annotation", "event_frontend", "spatial_memory"]

[tool.setuptools.package-data]
online_annotation = ["config.json", "prompts/*.txt"]
event_frontend = ["*.json"]
